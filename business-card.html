<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Columbia Gadget Works Business Card</title>
<!--
  US business card, 3.5 x 2 in, front and back. Same design language as
  pamphlet.html (website palette, kiosk drafting grid, mono labels).

  Two layouts from one design, picked by the URL:
    business-card.html          one card per page with 1/8 in bleed on
                                every side (3.75 x 2.25 in), for a print shop
    business-card.html?sheet    US Letter, 10 cards per side, laid out for
                                Avery 8371-style perforated card sheets
  Every card is drawn at bleed size; the sheet layout clips it to 3.5 x 2 in.
-->
<style>
  :root {
    --rust: #BF4D28;
    --rust-dark: #983C1E;
    --ink: #1F1F23;
    --steel-deep: #1C2228;
    --paper: #FAF7F2;
    --grid: #EFE6DA;
    --muted: #5E5A55;
    --line: #E5DED4;
    --font: Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
    --mono: Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;

    --bleed: .125in;
    /* Keep text this far inside the trim line */
    --safe: .16in;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  img { display: block; }

  /* ---------- one card, drawn at bleed size ---------- */
  .card {
    position: relative;
    width: calc(3.5in + 2 * var(--bleed));
    height: calc(2in + 2 * var(--bleed));
    padding: calc(var(--bleed) + var(--safe));
    overflow: hidden;
  }

  /* Front: dark, like the website hero and footer */
  .front {
    background-color: var(--steel-deep);
    background-image:
      linear-gradient(rgba(255,255,255,.045) .6pt, transparent .6pt),
      linear-gradient(90deg, rgba(255,255,255,.045) .6pt, transparent .6pt);
    background-size: .25in .25in;
    color: #fff;
    display: flex;
    align-items: center;
    gap: .14in;
    /* Sit the block a little above center, clear of the rust stripe */
    padding-bottom: calc(var(--bleed) + var(--safe) + .06in);
  }
  .front::after {
    /* Rust rule along the bottom, running into the bleed */
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(var(--bleed) + .07in);
    background: var(--rust);
  }
  .front .logo { width: 1.12in; height: 1.12in; flex: none; }
  .front .name {
    font-size: 19pt;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.015em;
    margin: 0 0 .1in;
  }
  .front .tag {
    font-family: var(--mono);
    font-size: 6.8pt;
    font-weight: 700;
    letter-spacing: .14em;
    line-height: 1.45;
    text-transform: uppercase;
    color: #F3A98A;
    margin: 0;
  }

  /* Back: warm paper with the kiosk drafting grid */
  .back {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) .6pt, transparent .6pt),
      linear-gradient(90deg, var(--grid) .6pt, transparent .6pt);
    background-size: .25in .25in;
    display: flex;
    gap: .14in;
  }
  .back { flex-direction: column; gap: 0; }
  .back .top { display: flex; gap: .12in; flex: 1; min-height: 0; }
  .back .info { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 5.4pt;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--rust-dark);
    margin: 0 0 .01in;
  }
  .hack {
    border-left: 2.5pt solid var(--rust);
    padding-left: .07in;
    margin-bottom: .07in;
  }
  .hack b { display: block; font-size: 9.4pt; line-height: 1.15; }
  .hack span { font-size: 6.8pt; color: var(--muted); }
  .lines { margin: 0; font-size: 6.9pt; line-height: 1.38; }
  .lines .url {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--rust-dark);
  }
  /* QR box hugs the code and its label */
  .qr {
    flex: none;
    align-self: flex-start;
    background: #fff;
    border: 1pt solid var(--ink);
    padding: .03in .03in .045in;
    text-align: center;
  }
  .qr .code { width: .78in; height: .78in; }
  .qr .label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .025in;
    font-size: 5.8pt;
    font-weight: 700;
    line-height: 1;
  }
  .qr .label img { width: .09in; height: .09in; }

  .all {
    margin: 0;
    font-size: 6.2pt;
    color: var(--muted);
  }
  .all b { font-family: var(--mono); color: var(--rust-dark); }

  /* Social row along the bottom */
  .social {
    display: flex;
    align-items: center;
    gap: .07in;
    border-top: .9pt solid var(--ink);
    padding-top: .05in;
    margin-top: .04in;
  }
  .social img { width: .13in; height: .13in; }
  .social .handle {
    font-family: var(--mono);
    font-size: 6.6pt;
    font-weight: 700;
    color: var(--rust-dark);
    margin-right: auto;
  }

  /* ---------- layout: print shop (one card per page, with bleed) ---------- */
  @page { margin: 0; }
  .shop { display: block; }
  .shop .card { break-after: page; }
  .shop .card:last-child { break-after: auto; }

  /* ---------- layout: letter sheet, 2 x 5, no gutters ---------- */
  .sheet {
    width: 8.5in;
    height: 11in;
    /* Avery 8371 / 5371: 0.5 in top margin, 0.75 in side margins */
    padding: .5in .75in;
    display: grid;
    grid-template-columns: repeat(2, 3.5in);
    grid-template-rows: repeat(5, 2in);
    break-after: page;
    position: relative;
  }
  .sheet:last-child { break-after: auto; }
  .clip { width: 3.5in; height: 2in; overflow: hidden; position: relative; }
  .clip .card { margin: calc(-1 * var(--bleed)); }
  /* Faint trim guides, outside the cards, to check alignment on a test print */
  .sheet .guide { position: absolute; background: #bbb; }
</style>
</head>
<body>

<template id="front">
  <div class="card front">
    <img class="logo" src="assets/logo/cgw-gear.png" alt="Columbia Gadget Works gear logo">
    <div>
      <p class="name">Columbia<br>Gadget Works</p>
      <p class="tag">Community makerspace<br>Columbia, MO<br>Est. 2017</p>
    </div>
  </div>
</template>

<template id="back">
  <div class="card back">
    <div class="top">
      <div class="info">
        <div class="hack">
          <p class="eyebrow">Free Open Hack Night</p>
          <b>Thursdays, 6 to 8 pm</b>
          <span>Open to everyone, no experience needed</span>
        </div>
        <p class="lines">
          1404 Grand Ave, Columbia, MO 65203<br>
          <span class="url">columbiagadgetworks.org</span><br>
          mail@columbiagadgetworks.org
        </p>
      </div>
      <div class="qr">
        <img class="code" src="build/qr/discord.svg" alt="QR code linking to the Columbia Gadget Works Discord server">
        <span class="label"><img src="assets/icons/discord.svg" alt="">Join our Discord</span>
      </div>
    </div>
    <p class="all">Every link in one place: <b>columbiagadgetworks.org/links</b></p>
    <div class="social">
      <img src="assets/icons/instagram.svg" alt="Instagram">
      <span class="handle">@columbiagadgetworks</span>
      <img src="assets/icons/facebook.svg" alt="Facebook">
      <img src="assets/icons/tiktok.svg" alt="TikTok">
      <img src="assets/icons/bluesky.svg" alt="Bluesky">
      <img src="assets/icons/linkedin.svg" alt="LinkedIn">
    </div>
  </div>
</template>

<script>
  const card = id => document.getElementById(id).content.firstElementChild.cloneNode(true);
  const sheetMode = new URLSearchParams(location.search).has("sheet");

  if (!sheetMode) {
    const style = document.createElement("style");
    style.textContent = "@page { size: 3.75in 2.25in; }";
    document.head.append(style);
    const wrap = document.createElement("div");
    wrap.className = "shop";
    wrap.append(card("front"), card("back"));
    document.body.append(wrap);
  } else {
    const style = document.createElement("style");
    style.textContent = "@page { size: 8.5in 11in; }";
    document.head.append(style);
    // Every card is the same, so the back sheet needs no mirroring for
    // duplex printing: the columns line up either way.
    for (const side of ["front", "back"]) {
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      for (let i = 0; i < 10; i++) {
        const clip = document.createElement("div");
        clip.className = "clip";
        clip.append(card(side));
        sheet.append(clip);
      }
      // Short trim ticks in the margins at each cut line
      const ticks = [];
      for (const x of [0.75, 4.25, 7.75]) ticks.push({ left: x - 0.003, top: 0.2, w: 0.006, h: 0.2 }, { left: x - 0.003, top: 10.6, w: 0.006, h: 0.2 });
      for (let r = 0; r <= 5; r++) { const y = 0.5 + 2 * r; ticks.push({ left: 0.35, top: y - 0.003, w: 0.2, h: 0.006 }, { left: 7.95, top: y - 0.003, w: 0.2, h: 0.006 }); }
      for (const t of ticks) {
        const g = document.createElement("div");
        g.className = "guide";
        Object.assign(g.style, { left: t.left + "in", top: t.top + "in", width: t.w + "in", height: t.h + "in" });
        sheet.append(g);
      }
      document.body.append(sheet);
    }
  }
</script>
</body>
</html>
